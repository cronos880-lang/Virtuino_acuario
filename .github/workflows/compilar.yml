name: Compilar Acuaris

# Pruebas automáticas + Android (.apk) en cada push.
# Los resultados se descargan en la pestaña "Actions" > ejecución > "Artifacts".

on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_DIR: ${{ github.workspace }}/.godot-bin

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Caché de Godot
        uses: actions/cache@v4
        with:
          path: |
            .godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-v1

      - name: Instalar Godot ${{ env.GODOT_VERSION }}
        run: scripts/ci/instalar_godot.sh

      - name: Importar proyecto
        run: $GODOT_DIR/godot --headless --path acuaris --import || true

      - name: Pruebas automáticas
        run: $GODOT_DIR/godot --headless --path acuaris -s res://tests/ejecutar_pruebas.gd

      # El .exe de Windows no se genera hasta que el programa esté terminado (decisión del propietario).

  android:
    runs-on: ubuntu-24.04
    needs: pruebas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compilar complemento Bluetooth (AAR)
        run: |
          gradle -p android-plugin assembleRelease --no-daemon
          mkdir -p acuaris/addons/acuaris_bluetooth/bin
          cp android-plugin/build/outputs/aar/AcuarisBluetooth-release.aar acuaris/addons/acuaris_bluetooth/bin/

      - name: Caché de Godot
        uses: actions/cache@v4
        with:
          path: |
            .godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-v1

      - name: Instalar Godot ${{ env.GODOT_VERSION }}
        run: scripts/ci/instalar_godot.sh

      - name: Configurar SDK de Android y firma
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/firma/acuaris_debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat ~/.config/godot/editor_settings-4.7.tres

      - name: Importar proyecto
        run: $GODOT_DIR/godot --headless --path acuaris --import || true

      - name: Exportar APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/firma/acuaris_debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          $GODOT_DIR/godot --headless --path acuaris --install-android-build-template --export-debug "Android" ../build/Acuaris.apk
          test -s build/Acuaris.apk
          ls -la build

      - name: Comprobar el APK
        run: |
          unzip -l build/Acuaris.apk | grep -E "classes.*\.dex|libgodot|AndroidManifest" | head
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$AAPT" dump permissions build/Acuaris.apk | head -20 || true

      - uses: actions/upload-artifact@v4
        with:
          name: Acuaris-Android
          path: build/Acuaris.apk
          retention-days: 30
